[mod-setting-name]
wide-splitters-max-width=Wide splitters: maximum width
wide-splitters-balance-interval=Wide splitters: balance interval (ticks)

wide-splitters-art-style=Wide splitters: art style

[mod-setting-description]
wide-splitters-max-width=Generates splitters from 3 up to this many belts wide, for every belt tier. Requires a restart.
wide-splitters-balance-interval=How often each wide splitter rebalances items across its belts. Lower is smoother but costs more UPS.

wide-splitters-art-style=Tiled repeats the splitter art across the width and shows in the placement preview and ghosts. Stretched draws one stretched splitter after placement, but the preview and ghosts are invisible. Requires a restart.

[string-mod-setting]
wide-splitters-art-style-tiled=Tiled
wide-splitters-art-style-stretched=Stretched

[wide-splitters]
name=__1__ (__2__ wide)
description=A splitter that is __1__ belts wide. Balances items across all of its belts.
